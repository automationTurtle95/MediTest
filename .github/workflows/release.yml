name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build release artifacts
        shell: pwsh
        working-directory: MediTest
        run: |
          [xml]$project = Get-Content .\MediTest.csproj
          $version = [string]($project.Project.PropertyGroup | Select-Object -First 1).Version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Keine <Version> in MediTest.csproj gefunden."
          }

          $expectedTag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Git-Tag $env:GITHUB_REF_NAME passt nicht zur Projektversion $version. Erwartet: $expectedTag"
          }

          .\scripts\build-release.ps1 -GitHubRepository "${{ github.repository }}"

      - name: Publish GitHub release
        shell: pwsh
        working-directory: MediTest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false

          [xml]$project = Get-Content .\MediTest.csproj
          $version = [string]($project.Project.PropertyGroup | Select-Object -First 1).Version
          $tag = "v$version"
          $releaseRoot = "dist/MediTest-$version"
          $files = @(
            "$releaseRoot/windows/MediTest-Setup-$version-win-x64.msi",
            "$releaseRoot/windows/MediTest-$version-win-x64-portable.zip",
            "$releaseRoot/macos/MediTest-$version-macos-arm64-setup.zip",
            "$releaseRoot/macos/MediTest-$version-macos-x64-setup.zip",
            "$releaseRoot/latest.json",
            "$releaseRoot/SHA256SUMS.txt"
          )

          foreach ($file in $files) {
            if (!(Test-Path -LiteralPath $file)) {
              throw "Release-Datei fehlt: $file"
            }
          }

          $null = gh release view $tag 2>$null
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            gh release upload $tag @files --clobber
          }
          else {
            gh release create $tag @files --title "MediTest $version" --notes "MediTest $version"
          }
