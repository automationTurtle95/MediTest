<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Statistik · MediTest</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<header class="topbar"><a class="brand" href="/pages/documents.html">MediTest</a><nav><a href="/pages/documents.html">Dokumente</a><a href="/pages/manual.html">Manuell</a><a href="/pages/tests.html">Tests</a><a href="/pages/stats.html">Statistik</a></nav></header>
<main>
  <section class="card">
    <h1>Gesamtstatistik</h1>
    <p class="muted">Auswertung über alle abgeschlossenen Tests oder gezielt pro Test.</p>
    <label for="testSelect">Test auswählen</label>
    <select id="testSelect"><option value="">Alle Tests</option></select>
    <div class="actions">
      <button onclick="loadStats()">Aktualisieren</button>
      <button class="danger" onclick="resetTests()">Tests & Statistik zurücksetzen</button>
    </div>
    <div id="msg" class="hidden"></div>
  </section>

  <section id="stats" class="grid"></section>

  <section class="card">
    <h2>Visuelle Auswertung</h2>
    <div id="charts" class="chart-grid"></div>
  </section>

  <section class="card">
    <h2>Lernempfehlung</h2>
    <div id="recommendations" class="recommendation-list"></div>
  </section>

  <section class="card">
    <h2 id="topicTitle">Themenanalyse</h2>
    <div class="topic-jump">
      <select id="topicSelect"><option value="">Thema auswählen</option></select>
      <button type="button" onclick="openSelectedTopic()">Zum Thema springen</button>
    </div>
    <div id="topics"></div>
  </section>

  <section class="card">
    <h2>Schwache Fragen</h2>
    <div id="weakQuestions"></div>
  </section>

  <section class="card">
    <h2>Verlauf</h2>
    <div id="progress"></div>
  </section>
</main>
<script src="/js/api.js"></script>
<script>
function percent(value){ return `${Number(value||0).toFixed(1).replace('.0','')}%`; }
function topicHref(topic){ return `/pages/questions.html?topic=${encodeURIComponent(topic)}`; }
function pieHtml(label,value,detail,color='var(--primary)'){
  const v=Math.max(0,Math.min(100,Number(value)||0));
  return `<article class="chart-card"><div class="pie" style="--value:${v};--chart-color:${color}"><span>${percent(v)}</span></div><h3>${esc(label)}</h3><p class="muted">${esc(detail||'')}</p></article>`;
}
async function loadTests(){
  const tests=await api('/api/tests');
  const sel=document.getElementById('testSelect');
  sel.innerHTML='<option value="">Alle Tests</option>';
  tests.forEach(t=>{const o=document.createElement('option'); o.value=t.testSessionId; o.textContent=`${t.testName} · ${t.documentName}`; sel.appendChild(o);});
}
function renderSummary(s){
  document.getElementById('stats').innerHTML=`
    <article class="card"><h2>Tests</h2><div class="score">${s.completedTests}/${s.totalTests}</div><p class="muted">abgeschlossen · ${s.openTests||0} offen</p></article>
    <article class="card"><h2>Durchschnitt</h2><div class="score">${percent(s.averagePercent)}</div><p class="muted">alle abgeschlossenen Tests</p></article>
    <article class="card"><h2>Bestanden</h2><div class="score">${percent(s.passRate)}</div><p>${s.passedTests} bestanden · ${s.failedTests} nicht bestanden</p></article>
    <article class="card"><h2>Prüfungsstand</h2><div class="score">${percent(s.readinessPercent)}</div><p class="muted">${esc(s.readinessLabel)}</p></article>
    <article class="card"><h2>Antworten</h2><div class="score">${s.totalCorrectAnswers}/${s.totalAnsweredQuestions}</div><p class="muted">${percent(s.answerAccuracy)} richtig beantwortet</p></article>`;
}
function renderCharts(s){
  const difficulty=s.difficultyPerformance||[];
  const difficultyCharts=difficulty.length
    ? difficulty.map(d=>pieHtml(`Schwierigkeit: ${d.difficulty}`,d.percent,`${d.correct}/${d.attempts} richtig`,d.difficulty==='schwer'?'#ef4444':d.difficulty==='mittel'?'#f59e0b':'#16a34a')).join('')
    : '<p class="muted">Noch keine Schwierigkeitsdaten.</p>';
  document.getElementById('charts').innerHTML=`
    ${pieHtml('Bestehensquote',s.passRate,`${s.passedTests} von ${s.completedTests} Tests bestanden`,'#16a34a')}
    ${pieHtml('Antwortgenauigkeit',s.answerAccuracy,`${s.totalCorrectAnswers} von ${s.totalAnsweredQuestions} Antworten richtig`,'#0ea5e9')}
    ${pieHtml('Prüfungsstand',s.readinessPercent,s.readinessLabel,'#8b5cf6')}
    ${difficultyCharts}`;
}
function renderRecommendations(s){
  const items=s.learningRecommendations||[];
  document.getElementById('recommendations').innerHTML=items.length
    ? items.map(r=>`<article class="recommendation"><h3>${esc(r.title)}</h3><p>${esc(r.description)}</p><a class="button" href="${esc(r.href)}">Fragen öffnen</a></article>`).join('')
    : '<p class="muted">Noch keine Lernempfehlung. Schließe zuerst einen Test ab.</p>';
}
function renderTopics(s){
  const topics=s.topicPerformance||[];
  const topicSelect=document.getElementById('topicSelect');
  topicSelect.innerHTML='<option value="">Thema auswählen</option>'+topics.map(t=>`<option value="${esc(t.topic)}">${esc(t.topic)} · ${percent(t.percent)}</option>`).join('');
  document.getElementById('topicTitle').textContent=s.scopeTestName?`Themenanalyse – ${s.scopeTestName}`:'Themenanalyse – alle Tests';
  document.getElementById('topics').innerHTML=topics.length?`
    <div class="topic-list">
      ${topics.map(t=>`<article class="topic-row">
        <div>
          <h3>${esc(t.topic)}</h3>
          <p class="muted">${t.questionCount} Fragen in ${t.documentCount} Pool(s) · ${t.correct}/${t.attempts} richtig · ${t.errors} Fehler</p>
        </div>
        <div class="topic-row-actions">
          <span class="pill">${percent(t.percent)}</span>
          <a class="button" href="${topicHref(t.topic)}">Fragen ansehen</a>
        </div>
      </article>`).join('')}
    </div>`:'<p class="muted">Keine Themendaten.</p>';
}
function renderWeakQuestions(s){
  const questions=s.weakQuestions||[];
  document.getElementById('weakQuestions').innerHTML=questions.length?questions.map(q=>`
    <article class="weak-question">
      <p class="muted">${esc(q.documentName)} · ${esc(q.topic)} · ${esc(q.difficulty)}</p>
      <h3>${esc(q.questionText)}</h3>
      <p>${q.errors}/${q.attempts} falsch · Fehlerquote ${percent(q.errorRate)}</p>
      <a class="button" href="${topicHref(q.topic)}#q-${q.questionId}">Frage öffnen</a>
    </article>`).join(''):'<p class="muted">Keine wiederholt falschen Fragen.</p>';
}
function renderProgress(s){
  const points=s.progress||[];
  if(!points.length){document.getElementById('progress').innerHTML='<p class="muted">Noch kein abgeschlossener Test.</p>';return;}
  document.getElementById('progress').innerHTML=`<div class="progress-bars">${points.slice(-12).map(p=>{
    const height=Math.max(8,Math.min(100,Number(p.percent)||0));
    return `<a class="progress-bar" href="/pages/review.html?id=${p.testSessionId}" title="${esc(p.testName)} · ${percent(p.percent)}"><span style="height:${height}%"></span><small>${percent(p.percent)}</small></a>`;
  }).join('')}</div>`;
}
async function loadStats(){
  const id=document.getElementById('testSelect').value;
  const s=await api('/api/stats/overview'+(id?`?testSessionId=${id}`:''));
  renderSummary(s);
  renderCharts(s);
  renderRecommendations(s);
  renderTopics(s);
  renderWeakQuestions(s);
  renderProgress(s);
  enhanceTooltips();
}
function openSelectedTopic(){
  const topic=document.getElementById('topicSelect').value;
  if(topic) location.href=topicHref(topic);
}
async function resetTests(){
  const msg=document.getElementById('msg');
  if(!confirm('Wirklich alle gespeicherten Tests und Statistiken zurücksetzen?\n\nDokumente und Fragenpools bleiben erhalten.')) return;
  status(msg,'Setze Tests und Statistik zurück...');
  try{const r=await api('/api/tests',{method:'DELETE'}); status(msg,`Zurückgesetzt: ${r.testsDeleted} Tests gelöscht.`, 'status success'); await loadTests(); await loadStats();}
  catch(e){status(msg,e.message,'status error');}
}
loadTests().then(loadStats).catch(e=>status(document.getElementById('msg'),e.message,'status error'));
</script>
</body>
</html>
