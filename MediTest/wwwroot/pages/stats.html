<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Statistik · Meduvalo</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/index.html">
        <span class="brand-mark"><img src="/assets/meduvalo-logo.svg" alt="" /></span>
        Meduvalo
      </a>
      <nav>
        <a href="/index.html">Start</a>
        <a href="/pages/documents.html">Dokumente</a>
        <a href="/pages/learn.html">Lernen</a>
        <a href="/pages/tests.html">Tests</a>
        <a href="/pages/stats.html" class="active">Statistik</a>
      </nav>
    </header>
    <main>
      <section class="card">
        <h1>Gesamtstatistik</h1>
        <p class="muted">Auswertung über alle abgeschlossenen Tests oder gezielt pro Test.</p>
        <label for="testSelect">Test auswählen</label>
        <select id="testSelect">
          <option value="">Alle Tests</option>
        </select>
        <div class="actions">
          <button type="button" onclick="loadStats()">Aktualisieren</button>
          <button class="danger" type="button" onclick="resetTests()">Tests &amp; Statistik zurücksetzen</button>
        </div>
        <div class="actions" style="margin-top: 8px">
          <button type="button" onclick="exportCsv('tests')">⬇ Testverlauf (CSV)</button>
          <button type="button" onclick="exportCsv('topics')">⬇ Themenanalyse (CSV)</button>
          <button type="button" onclick="exportCsv('weak-questions')">⬇ Schwache Fragen (CSV)</button>
        </div>
        <div id="msg" class="hidden"></div>
      </section>

      <section id="stats" class="grid"></section>

      <section class="card">
        <h2>Testverlauf</h2>
        <div id="progress"></div>
      </section>

      <section class="card">
        <h2>Visuelle Auswertung</h2>
        <div id="charts" class="chart-grid"></div>
      </section>

      <section class="card">
        <h2>Lernempfehlung</h2>
        <div id="recommendations" class="recommendation-list"></div>
      </section>

      <section class="card">
        <h2 id="topicTitle">Themenanalyse</h2>
        <div class="topic-jump">
          <select id="topicSelect">
            <option value="">Thema auswählen</option>
          </select>
          <button type="button" onclick="openSelectedTopic()">Zum Thema springen</button>
        </div>
        <div id="topics"></div>
      </section>

      <section class="card">
        <h2>Schwache Fragen</h2>
        <div id="weakQuestions"></div>
        <div id="weakTestActions" class="actions hidden" style="margin-top: 16px">
          <button class="button primary" type="button" onclick="startWeakTest()">
            Test aus schwachen Fragen starten
          </button>
          <a class="button" href="/pages/learn.html?weak=1">Schwache Fragen lernen</a>
        </div>
        <div id="weakTestMsg" class="hidden" style="margin-top: 8px"></div>
      </section>
    </main>
    <script src="/js/api.js"></script>
    <script src="/js/pages/stats.js"></script>
  </body>
</html>
