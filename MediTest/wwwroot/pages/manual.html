<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Manuell · Meduvalo</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/index.html">Meduvalo</a>
      <nav>
        <a href="/index.html">Start</a><a href="/pages/documents.html">Dokumente</a
        ><a href="/pages/manual.html" class="active">Manuell</a><a href="/pages/tests.html">Tests</a
        ><a href="/pages/stats.html">Statistik</a>
      </nav>
    </header>
    <main>
      <section class="card">
        <h1>Frage manuell erstellen</h1>
        <p class="muted">Lege eigene Multiple-Choice-Fragen an. Optional kannst du ein Bild zur Frage hinzufügen.</p>
        <div id="msg" class="hidden"></div>
        <form id="manualForm">
          <label for="documentId">Vorhandener Fragenpool</label>
          <select id="documentId">
            <option value="">Neuen Fragenpool erstellen</option>
          </select>
          <label for="documentName">Neuer Fragenpool-Name</label>
          <input type="text" id="documentName" placeholder="z. B. Anatomie Kopf Hals" />
          <label for="questionText">Fragetext</label>
          <textarea id="questionText" rows="4" required></textarea>
          <div class="field-row">
            <div><label for="topic">Thema</label><input type="text" id="topic" placeholder="z. B. Kardiologie" /></div>
            <div>
              <label for="difficulty">Schwierigkeit</label
              ><select id="difficulty">
                <option>leicht</option>
                <option selected>mittel</option>
                <option>schwer</option>
              </select>
            </div>
          </div>
          <label for="imageFile">Bild zur Frage</label>
          <input id="imageFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif" />
          <p class="subtle">PNG, JPEG, WebP oder GIF bis 600 KB.</p>
          <label for="imageAltText">Bildbeschreibung</label>
          <input type="text" id="imageAltText" placeholder="z. B. EKG mit ST-Hebung" />
          <figure id="imagePreview" class="question-image hidden"></figure>
          <div class="field-row">
            <div><label for="option0">Antwort A</label><input type="text" id="option0" required /></div>
            <div><label for="option1">Antwort B</label><input type="text" id="option1" required /></div>
            <div><label for="option2">Antwort C</label><input type="text" id="option2" required /></div>
            <div><label for="option3">Antwort D</label><input type="text" id="option3" required /></div>
            <div><label for="option4">Antwort E</label><input type="text" id="option4" required /></div>
          </div>
          <label for="correctOptionIndex">Richtige Antwort</label>
          <select id="correctOptionIndex">
            <option value="0">A</option>
            <option value="1">B</option>
            <option value="2">C</option>
            <option value="3">D</option>
            <option value="4">E</option>
          </select>
          <label for="explanation">Erklärung</label>
          <textarea id="explanation" rows="3" placeholder="Kurze Erklärung zur richtigen Antwort..."></textarea>
          <div class="actions"><button class="primary" type="submit">Frage speichern</button></div>
        </form>
      </section>
    </main>
    <script src="/js/api.js"></script>
    <script src="/js/pages/manual.js"></script>
  </body>
</html>
