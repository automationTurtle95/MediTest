<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Test · Meduvalo</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/index.html">
        <span class="brand-mark"><img src="/assets/meduvalo-logo.svg" alt="" /></span>
        Meduvalo
      </a>
      <nav>
        <a href="/index.html">Start</a>
        <a href="/pages/documents.html">Dokumente</a>
        <a href="/pages/learn.html">Lernen</a>
        <a href="/pages/tests.html" class="active">Tests</a>
        <a href="/pages/stats.html">Statistik</a>
      </nav>
    </header>
    <main>
      <section class="card">
        <div class="progress"><div id="bar"></div></div>
        <p id="counter" class="muted"></p>
        <h1 id="question">Frage wird geladen...</h1>
        <figure id="questionImage" class="question-image hidden"></figure>
        <p>
          <span id="topic" class="pill"></span> <span id="difficulty" class="pill"></span>
          <span id="aiBadge" class="badge ai-badge hidden">KI</span>
        </p>
        <div id="options" role="radiogroup" aria-label="Antwortmöglichkeiten"></div>
        <div class="actions">
          <button id="prev" type="button">← Zurück</button
          ><button id="next" class="primary" type="button">Weiter →</button
          ><button id="submit" class="primary hidden" type="button">Test abgeben</button
          ><a id="pdf" class="button" href="#">PDF herunterladen</a>
        </div>
        <p class="muted" style="font-size: 12px; margin-top: 8px">
          Tastatur: <kbd>A</kbd>–<kbd>D</kbd> Antwort wählen · <kbd>Enter</kbd> / <kbd>→</kbd> Weiter ·
          <kbd>←</kbd> Zurück
        </p>
        <div id="msg" class="hidden"></div>
      </section>
    </main>
    <script src="/js/api.js"></script>
    <script src="/js/pages/test.js"></script>
  </body>
</html>
