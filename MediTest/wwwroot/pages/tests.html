<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tests · Meduvalo</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/index.html">Meduvalo</a>
      <nav>
        <a href="/index.html">Start</a><a href="/pages/documents.html">Dokumente</a
        ><a href="/pages/manual.html">Manuell</a><a href="/pages/tests.html" class="active">Tests</a
        ><a href="/pages/stats.html">Statistik</a>
      </nav>
    </header>
    <main>
      <section class="card hidden" id="restrictedTestStarter">
        <h1>Test aus vorhandenem Fragenpool starten</h1>
        <p class="muted">
          Nach der Testphase kannst du weiterhin Tests aus deinen bereits vorhandenen Fragenpools ausführen.
        </p>
        <form id="restrictedTestForm">
          <label for="restrictedTestSource">Fragenpool</label>
          <select id="restrictedTestSource" required></select>
          <div class="field-row">
            <div>
              <label for="restrictedTestCount">Fragen</label
              ><input id="restrictedTestCount" type="number" min="1" max="100" value="25" required />
            </div>
            <div>
              <label for="restrictedTestName">Testname <span class="muted">(optional)</span></label
              ><input id="restrictedTestName" type="text" maxlength="200" />
            </div>
          </div>
          <div class="actions"><button class="primary" type="submit">Test starten</button></div>
          <div id="restrictedTestMsg" class="hidden"></div>
        </form>
      </section>
      <section class="card">
        <h1>Gespeicherte Tests</h1>
        <p class="muted">Hier siehst du alle durchgeführten oder gestarteten Tests inkl. Ergebnis.</p>
        <div id="msg" class="hidden"></div>
        <div id="list"></div>
      </section>
    </main>
    <script src="/js/api.js"></script>
    <script src="/js/pages/tests.js"></script>
  </body>
</html>
