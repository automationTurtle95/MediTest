<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tests · MediTest</title><link rel="stylesheet" href="/css/styles.css"></head><body>
<header class="topbar"><a class="brand" href="/pages/documents.html">MediTest</a><nav><a href="/pages/documents.html">Dokumente</a><a href="/pages/manual.html">Manuell</a><a href="/pages/tests.html">Tests</a><a href="/pages/stats.html">Statistik</a></nav></header>
<main><section class="card"><h1>Gespeicherte Tests</h1><p class="muted">Hier siehst du alle durchgeführten oder gestarteten Tests inkl. Ergebnis.</p><div id="msg" class="hidden"></div><div id="list"></div></section></main>
<script src="/js/api.js"></script><script>
let testsCache=[];
function testActions(t){
  const rename=`<button type="button" onclick="renameTest(${t.testSessionId})">Umbenennen</button>`;
  const pdf=`<button type="button" onclick="downloadTestPdf(${t.testSessionId})">PDF herunterladen</button>`;
  if(t.submittedAt) return `<a class="button" href="/pages/review.html?id=${t.testSessionId}">Auswertung öffnen</a>${rename}${pdf}`;
  return `<a class="button primary" href="/pages/test.html?id=${t.testSessionId}">Test fortsetzen</a>${rename}<button class="danger" type="button" onclick="deleteOpenTest(${t.testSessionId})">Löschen</button>`;
}
async function downloadTestPdf(id){
  try{await downloadApiFile(`/api/tests/${id}/pdf`,`MediTest-${id}.pdf`);}
  catch(e){status(document.getElementById('msg'),e.message,'status error');}
}
async function renameTest(id){
  const msg=document.getElementById('msg');
  const currentName=testsCache.find(t=>t.testSessionId===id)?.testName||'';
  const name=prompt('Neuer Testname',currentName||'');
  if(name===null) return;
  const testName=name.trim();
  if(!testName){status(msg,'Bitte gib einen Testnamen ein.','status error');return;}
  try{
    await api(`/api/tests/${id}/name`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({testName})});
    status(msg,'Test umbenannt.','status success');
    await load();
  }catch(e){status(msg,e.message,'status error');}
}
async function deleteOpenTest(id){
  const msg=document.getElementById('msg');
  const current=testsCache.find(t=>t.testSessionId===id);
  if(!current||current.submittedAt) return;
  if(!confirm(`Angefangenen Test "${current.testName}" wirklich löschen?\n\nAbgeschlossene Tests und Fragenpools bleiben erhalten.`)) return;
  try{
    await api(`/api/tests/${id}`,{method:'DELETE'});
    status(msg,'Angefangener Test gelöscht.','status success');
    await load();
  }catch(e){status(msg,e.message,'status error');}
}
function testStatus(t){
  if(t.submittedAt) return `Ergebnis: <b>${t.score}/${t.questionCount}</b> (${t.percent}%) · <b class="${t.passed?'success':'error'}">${t.passed?'Bestanden':'Nicht bestanden'}</b>`;
  return `<span class="badge">Offen</span> Noch nicht abgegeben`;
}
async function load(){
  const box=document.getElementById('list');
  const items=await api('/api/tests');
  testsCache=items;
  if(!items.length){box.innerHTML='<p class="muted">Noch keine Tests.</p>'; return;}
  box.innerHTML=items.map(t=>`<article class="card"><p class="muted title-wrap">${new Date(t.startedAt).toLocaleString()} · Dokument: ${esc(t.documentName)}</p><h2 class="title-wrap">${esc(t.testName)} <span class="muted">(#${t.testSessionId})</span></h2><p>${testStatus(t)}</p><div class="actions">${testActions(t)}</div></article>`).join('');
  enhanceTooltips();
}
load().catch(e=>status(document.getElementById('msg'),e.message,'status error'));
</script></body></html>
