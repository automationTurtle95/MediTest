<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Anmeldung · MediTest</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<main class="auth-page">
  <section class="auth-brand">
    <div>
      <h1>MediTest</h1>
      <p>Multiple-Choice-Prüfungssimulation für Medizinstudenten.</p>
    </div>
    <div class="auth-version">Version 4.0.5</div>
  </section>
  <section class="auth-main">
    <div class="card auth-panel">
      <p class="eyebrow">Konto</p>
      <h2 id="formTitle">Einloggen</h2>
      <p id="authHint" class="muted">Melde dich an, um MediTest zu nutzen.</p>
      <div class="auth-tabs">
        <button id="loginTab" class="active" type="button">Einloggen</button>
        <button id="registerTab" type="button">Konto erstellen</button>
      </div>
      <form id="authForm">
        <div id="displayNameWrap" class="hidden">
          <label for="displayName">Name</label>
          <input id="displayName" autocomplete="name" placeholder="Vor- und Nachname">
        </div>
        <label for="email">E-Mail</label>
        <input id="email" type="email" autocomplete="email" required>
        <label for="password">Passwort</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <div class="actions">
          <button id="submitBtn" class="primary" type="submit">Einloggen</button>
          <button id="resetPasswordBtn" type="button">Passwort vergessen?</button>
        </div>
      </form>
      <div class="auth-meta">
        <span id="modeBadge" class="pill">Anmeldung</span>
      </div>
      <div id="msg" class="hidden"></div>
    </div>
  </section>
</main>
<div id="loginSuccess" class="login-success hidden" aria-live="polite">
  <div class="login-success-panel">
    <div class="login-success-logo">M</div>
    <div class="login-success-ring"><span>✓</span></div>
    <h2>Willkommen zurück</h2>
    <p>Dein Arbeitsbereich wird geladen</p>
    <div class="login-success-steps" aria-hidden="true"><span></span><span></span><span></span></div>
    <div class="login-success-bar" aria-hidden="true"><span></span></div>
  </div>
</div>
<script src="/js/api.js"></script>
<script>
const form=document.getElementById('authForm');
const msg=document.getElementById('msg');
const loginTab=document.getElementById('loginTab');
const registerTab=document.getElementById('registerTab');
const title=document.getElementById('formTitle');
const submitBtn=document.getElementById('submitBtn');
const displayNameWrap=document.getElementById('displayNameWrap');
const authHint=document.getElementById('authHint');
const modeBadge=document.getElementById('modeBadge');
const loginSuccess=document.getElementById('loginSuccess');
const resetPasswordBtn=document.getElementById('resetPasswordBtn');
let mode='login';
let loginRedirectTimer=null;

function safeReturnUrl(){
  const value=qs('returnUrl')||'/pages/documents.html';
  if(!value.startsWith('/')||value.startsWith('//')) return '/pages/documents.html';
  if(value.includes('/pages/login.html')) return '/pages/documents.html';
  return value;
}
function setMode(next){
  mode=next;
  const registering=mode==='register';
  loginTab.classList.toggle('active',!registering);
  registerTab.classList.toggle('active',registering);
  displayNameWrap.classList.toggle('hidden',!registering);
  title.textContent=registering?'Konto erstellen':'Einloggen';
  submitBtn.textContent=registering?'Registrieren':'Einloggen';
  resetPasswordBtn.classList.toggle('hidden',registering);
  document.getElementById('password').autocomplete=registering?'new-password':'current-password';
  msg.classList.add('hidden');
}
async function loadConfig(){
  try{
    const cfg=await getAuthConfig(true);
    modeBadge.textContent=cfg.cloudConfigured?'Firebase-Anmeldung':'Firebase fehlt';
    authHint.textContent=cfg.cloudConfigured
      ? 'Melde dich mit deinem Konto an.'
      : 'Firebase ist noch nicht vollständig konfiguriert.';
    registerTab.classList.toggle('hidden',!cfg.registrationEnabled);
  }catch(e){
    modeBadge.textContent='Anmeldung';
  }
}
loginTab.onclick=()=>setMode('login');
registerTab.onclick=()=>setMode('register');
resetPasswordBtn.onclick=async()=>{
  const email=document.getElementById('email').value.trim();
  try{
    status(msg,'Sende E-Mail zum Zurücksetzen...');
    const r=await sendFirebasePasswordReset(email);
    status(msg,r.message,'status success');
  }catch(err){
    status(msg,err.message,'status error');
  }
};
form.addEventListener('submit',async e=>{
  e.preventDefault();
  const payload={
    email:document.getElementById('email').value.trim(),
    password:document.getElementById('password').value,
    displayName:document.getElementById('displayName').value.trim()
  };
  try{
    status(msg,mode==='register'?'Konto wird erstellt...':'Anmeldung läuft...');
    const res=mode==='register'
      ? await registerWithFirebase(payload)
      : await loginWithFirebase(payload);
    status(msg,`Willkommen, ${res.user.displayName||res.user.email}.`,'status success');
    loginSuccess.classList.remove('hidden');
    setTimeout(async()=>{
      loginSuccess.classList.add('hidden');
      window.mediTestPostUpdateRedirect=safeReturnUrl();
      const updateInfo=await checkForAppUpdatePopup();
      if(updateInfo?.updateAvailable) return;
      loginRedirectTimer=setTimeout(()=>{location.href=safeReturnUrl();},350);
    },1450);
  }catch(err){
    status(msg,err.message,'status error');
  }
});
currentAuthUser(false).then(user=>{if(user) location.href=safeReturnUrl();}).catch(()=>{});
loadConfig();
enhanceTooltips();
</script>
</body>
</html>
