<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Anmeldung · MediTest</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<main class="auth-page">
  <section class="auth-brand">
    <div>
      <h1>MediTest</h1>
      <p>Multiple-Choice-Prüfungssimulation für Medizinstudenten.</p>
    </div>
    <div class="auth-version">Version 4.1.7</div>
  </section>
  <section class="auth-main">
    <div class="card auth-panel">
      <p class="eyebrow">Konto</p>
      <h2 id="formTitle">Einloggen</h2>
      <p id="authHint" class="muted">Melde dich an, um MediTest zu nutzen.</p>
      <div class="auth-tabs">
        <button id="loginTab" class="active" type="button">Einloggen</button>
        <button id="registerTab" type="button">Konto erstellen</button>
      </div>
      <div id="socialAuth" class="auth-provider-section hidden">
        <div class="auth-provider-list">
          <button id="googleLoginBtn" class="auth-provider-button auth-provider-google hidden" type="button">
            <svg class="auth-provider-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#4285F4" d="M21.35 12.22c0-.74-.07-1.45-.19-2.13H12v4.03h5.24a4.48 4.48 0 0 1-1.94 2.94v2.62h3.14c1.84-1.69 2.91-4.19 2.91-7.46Z"/>
              <path fill="#34A853" d="M12 21.72c2.62 0 4.82-.87 6.44-2.35l-3.14-2.62c-.87.58-1.98.93-3.3.93-2.53 0-4.67-1.71-5.44-4.01H3.31v2.7A9.72 9.72 0 0 0 12 21.72Z"/>
              <path fill="#FBBC05" d="M6.56 13.67A5.84 5.84 0 0 1 6.26 12c0-.58.1-1.14.3-1.67v-2.7H3.31A9.72 9.72 0 0 0 2.28 12c0 1.57.38 3.05 1.03 4.37l3.25-2.7Z"/>
              <path fill="#EA4335" d="M12 6.32c1.43 0 2.71.49 3.72 1.45l2.79-2.79A9.35 9.35 0 0 0 12 2.28a9.72 9.72 0 0 0-8.69 5.35l3.25 2.7C7.33 8.03 9.47 6.32 12 6.32Z"/>
            </svg>
            <span>Mit Google anmelden</span>
          </button>
          <button id="appleLoginBtn" class="auth-provider-button auth-provider-apple hidden" type="button">
            <svg class="auth-provider-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M17.05 12.54c-.02-2.3 1.88-3.42 1.97-3.47a4.23 4.23 0 0 0-3.34-1.8c-1.4-.15-2.76.84-3.47.84-.73 0-1.83-.82-3.01-.8a4.42 4.42 0 0 0-3.72 2.27c-1.61 2.79-.41 6.88 1.13 9.13.77 1.1 1.67 2.34 2.85 2.3 1.16-.05 1.59-.74 2.99-.74 1.38 0 1.79.74 3 .71 1.24-.02 2.02-1.1 2.76-2.21a9.13 9.13 0 0 0 1.26-2.57 3.98 3.98 0 0 1-2.42-3.66ZM14.77 5.78a4.08 4.08 0 0 0 .94-2.94 4.17 4.17 0 0 0-2.71 1.4 3.9 3.9 0 0 0-.97 2.84 3.44 3.44 0 0 0 2.74-1.3Z"/>
            </svg>
            <span>Mit Apple anmelden</span>
          </button>
        </div>
        <div class="auth-divider"><span>oder mit E-Mail</span></div>
      </div>
      <form id="authForm">
        <div id="displayNameWrap" class="hidden">
          <label for="displayName">Name</label>
          <input id="displayName" autocomplete="name" placeholder="Vor- und Nachname">
        </div>
        <label for="email">E-Mail</label>
        <input id="email" type="email" autocomplete="email" required>
        <label for="password">Passwort</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <div class="actions">
          <button id="submitBtn" class="primary" type="submit">Einloggen</button>
          <button id="resetPasswordBtn" type="button">Passwort vergessen?</button>
          <button id="resendVerificationBtn" class="hidden" type="button">Bestätigungs-E-Mail erneut senden</button>
        </div>
      </form>
      <div class="auth-meta">
        <span id="modeBadge" class="pill">Anmeldung</span>
      </div>
      <div id="msg" class="hidden"></div>
    </div>
  </section>
</main>
<div id="loginSuccess" class="login-success hidden" aria-live="polite">
  <div class="login-success-panel">
    <div class="login-success-logo">M</div>
    <div class="login-success-ring"><span>✓</span></div>
    <h2>Willkommen zurück</h2>
    <p>Dein Arbeitsbereich wird geladen</p>
    <div class="login-success-steps" aria-hidden="true"><span></span><span></span><span></span></div>
    <div class="login-success-bar" aria-hidden="true"><span></span></div>
  </div>
</div>
<script src="/js/api.js"></script>
<script>
const form=document.getElementById('authForm');
const msg=document.getElementById('msg');
const loginTab=document.getElementById('loginTab');
const registerTab=document.getElementById('registerTab');
const title=document.getElementById('formTitle');
const submitBtn=document.getElementById('submitBtn');
const displayNameWrap=document.getElementById('displayNameWrap');
const authHint=document.getElementById('authHint');
const modeBadge=document.getElementById('modeBadge');
const loginSuccess=document.getElementById('loginSuccess');
const resetPasswordBtn=document.getElementById('resetPasswordBtn');
const resendVerificationBtn=document.getElementById('resendVerificationBtn');
const socialAuth=document.getElementById('socialAuth');
const googleLoginBtn=document.getElementById('googleLoginBtn');
const appleLoginBtn=document.getElementById('appleLoginBtn');
let mode='login';
let loginRedirectTimer=null;

function safeReturnUrl(){
  const value=qs('returnUrl')||'/pages/documents.html';
  if(!value.startsWith('/')||value.startsWith('//')) return '/pages/documents.html';
  if(value.includes('/pages/login.html')) return '/pages/documents.html';
  return value;
}
function setMode(next){
  mode=next;
  const registering=mode==='register';
  loginTab.classList.toggle('active',!registering);
  registerTab.classList.toggle('active',registering);
  displayNameWrap.classList.toggle('hidden',!registering);
  title.textContent=registering?'Konto erstellen':'Einloggen';
  submitBtn.textContent=registering?'Registrieren':'Einloggen';
  resetPasswordBtn.classList.toggle('hidden',registering);
  resendVerificationBtn.classList.add('hidden');
  document.getElementById('password').autocomplete=registering?'new-password':'current-password';
  msg.classList.add('hidden');
}
async function loadConfig(){
  try{
    const cfg=await getAuthConfig(true);
    const googleEnabled=cfg.firebase?.googleEnabled===true;
    const appleEnabled=cfg.firebase?.appleEnabled===true;
    modeBadge.textContent=cfg.cloudConfigured?'Firebase-Anmeldung':'Firebase fehlt';
    authHint.textContent=cfg.cloudConfigured
      ? 'Melde dich mit E-Mail, Google oder Apple an.'
      : 'Firebase ist noch nicht vollständig konfiguriert.';
    registerTab.classList.toggle('hidden',!cfg.registrationEnabled);
    googleLoginBtn.classList.toggle('hidden',!googleEnabled);
    appleLoginBtn.classList.toggle('hidden',!appleEnabled);
    socialAuth.classList.toggle('hidden',!googleEnabled&&!appleEnabled);
  }catch(e){
    modeBadge.textContent='Anmeldung';
  }
}
async function completeLogin(res){
  status(msg,`Willkommen, ${res.user.displayName||res.user.email}.`,'status success');
  loginSuccess.classList.remove('hidden');
  setTimeout(async()=>{
    loginSuccess.classList.add('hidden');
    window.mediTestPostUpdateRedirect=safeReturnUrl();
    const updateInfo=await checkForAppUpdatePopup();
    if(updateInfo?.updateAvailable) return;
    loginRedirectTimer=setTimeout(()=>{location.href=safeReturnUrl();},350);
  },1450);
}
async function providerLogin(providerId){
  const label=providerId==='apple.com'?'Apple':'Google';
  try{
    googleLoginBtn.disabled=true;
    appleLoginBtn.disabled=true;
    status(msg,`${label}-Anmeldung wird geöffnet...`);
    const res=await loginWithFirebaseProvider(providerId);
    await completeLogin(res);
  }catch(error){
    status(msg,error.message,'status error');
  }finally{
    googleLoginBtn.disabled=false;
    appleLoginBtn.disabled=false;
  }
}
loginTab.onclick=()=>setMode('login');
registerTab.onclick=()=>setMode('register');
googleLoginBtn.onclick=()=>providerLogin('google.com');
appleLoginBtn.onclick=()=>providerLogin('apple.com');
resetPasswordBtn.onclick=async()=>{
  const email=document.getElementById('email').value.trim();
  try{
    status(msg,'Sende E-Mail zum Zurücksetzen...');
    const r=await sendFirebasePasswordReset(email);
    status(msg,r.message,'status success');
  }catch(err){
    status(msg,err.message,'status error');
  }
};
resendVerificationBtn.onclick=async()=>{
  try{
    status(msg,'Sende Bestätigungs-E-Mail...');
    const r=await resendFirebaseEmailVerification({
      email:document.getElementById('email').value.trim(),
      password:document.getElementById('password').value
    });
    status(msg,r.message,'status success');
    if(r.verified)resendVerificationBtn.classList.add('hidden');
  }catch(err){
    status(msg,err.message,'status error');
  }
};
form.addEventListener('submit',async e=>{
  e.preventDefault();
  const payload={
    email:document.getElementById('email').value.trim(),
    password:document.getElementById('password').value,
    displayName:document.getElementById('displayName').value.trim()
  };
  try{
    status(msg,mode==='register'?'Konto wird erstellt...':'Anmeldung läuft...');
    const res=mode==='register'
      ? await registerWithFirebase(payload)
      : await loginWithFirebase(payload);
    if(res.verificationRequired){
      setMode('login');
      document.getElementById('email').value=res.email||payload.email;
      document.getElementById('password').value='';
      resendVerificationBtn.classList.remove('hidden');
      status(msg,res.message,'status success');
      return;
    }
    await completeLogin(res);
  }catch(err){
    resendVerificationBtn.classList.toggle('hidden',err?.emailVerificationRequired!==true);
    status(msg,err.message,'status error');
  }
});
currentAuthUser(false).then(user=>{if(user) location.href=safeReturnUrl();}).catch(()=>{});
loadConfig();
if(qs('verificationRequired')==='1'){
  resendVerificationBtn.classList.remove('hidden');
  status(msg,'Bitte bestätige zuerst deine E-Mail-Adresse.','status error');
}
if(qs('accountDeleted')==='1'){
  status(msg,qs('message')||'Konto und zugehörige Daten wurden gelöscht.','status success');
}
enhanceTooltips();
</script>
</body>
</html>
